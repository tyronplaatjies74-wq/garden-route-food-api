<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Route Food API</title>
<style>
body{font-family:system-ui;background:#f4f4f5;padding:20px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h1{font-size:22px}
.badge{background:#e0f2fe;padding:2px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<h1>Garden Route Food API</h1>
<p id="status">Loading...</p>
<div id="grid"></div>

<script>
fetch('./restaurants.json')
  .then(r => {
    if(!r.ok) throw new Error('restaurants.json not found: '+r.status);
    return r.json();
  })
  .then(data => {
    const list = data.restaurants || data;
    document.getElementById('status').textContent = `Found ${list.length} places`;
    document.getElementById('grid').innerHTML = list.map(p => `
      <div class="card">
        <h3>${p.name}</h3>
        <p><span class="badge">${p.town}</span> ${p.cuisine_type}</p>
        <p>${p.description}</p>
        <p>📞 ${p.phone}</p>
        <p><a href="${p.website}" target="_blank">Website</a> | <a href="${p.google_maps_link}" target="_blank">Maps</a></p>
      </div>
    `).join('');
  })
  .catch(e => {
    document.getElementById('status').textContent = 'ERROR: ' + e.message;
    console.error(e);
  });
</script>
</body>
</html>
