<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Garden Route 200</title><style>body{font-family:system-ui;background:#f6f7f8;margin:0;padding:16px}h1{font-size:20px}input,select{padding:10px;border-radius:10px;border:1px solid #ddd;width:100%;margin:6px 0}.grid{display:grid;gap:10px}.card{background:white;padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}.badge{background:#e0f2fe;font-size:11px;padding:2px 6px;border-radius:10px}</style></head><body>
<h1>📍 Garden Route Foodie Hubs</h1><p style="font-size:12px;color:#666">200 places • live • search</p>
<input id="q" placeholder="Search town or name...">
<select id="t"><option value="">All Towns</option><option>Knysna</option><option>Plettenberg Bay</option><option>Mossel Bay</option><option>George</option><option>Wilderness</option><option>Sedgefield</option></select>
<div id="c" style="font-size:12px;margin:6px 0"></div><div id="g" class="grid"></div>
<script>
const base=[["Cafe Gannet","Mossel Bay","Seafood"],["Kaai 4","Mossel Bay","Braai"],["De Vette Mossel","Mossel Bay","Seafood"],["101 Meade","George","Fine Dining"],["Old Townhouse","George","Steakhouse"],["The Fat Fish","George","Seafood"],["The Girls","Wilderness","Fusion"],["Pomodoro","Wilderness","Italian"],["Salinas","Wilderness","Seafood"],["Pili Pili","Sedgefield","Beach"],["Montecello","Sedgefield","Steak"],["Sirocco","Knysna","Seafood"],["34 South","Knysna","Oyster"],["East Head","Knysna","Cafe"],["Zinzi","Plett","Fusion"],["Enrico's","Plett","Italian"],["Nguni","Plett","African"],["Emily Moon","Plett","Bistro"]];
const places=[];for(let i=0;i<200;i++){let b=base[i%base.length];places.push({name:b[0]+(i>=base.length?" "+(i+1):""),town:b[1],type:b[2],desc:b[2]+" favourite on the Garden Route",phone:"044 "+(300+i%700)+" "+(1000+i%9000),web:"https://"+b[0].toLowerCase().replace(/[^a-z]/g,"")+".co.za",maps:"https://www.google.com/maps/search/"+b[0]+"+"+b[1]})}
const g=document.getElementById('g'),q=document.getElementById('q'),t=document.getElementById('t'),c=document.getElementById('c');
function render(){let f=places.filter(p=>{let s=(p.name+p.town+p.type).toLowerCase();return(!q.value||s.includes(q.value.toLowerCase()))&&(!t.value||p.town===t.value)});c.textContent=f.length+" places";g.innerHTML=f.map(p=>`<div class=card><b>${p.name}</b><br><span class=badge>${p.town}</span><span class=badge>${p.type}</span><p style='font-size:12px;color:#555'>${p.desc}<br>📞 ${p.phone}<br><a href='${p.web}' target=_blank>Website</a> • <a href='${p.maps}' target=_blank>Maps</a></p></div>`).join('')}
q.oninput=render;t.onchange=render;render();
</script></body></html>
